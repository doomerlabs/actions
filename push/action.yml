name: Push Doomer
description: Validate, package, and push an adversary with a verified Doomer CLI release.

inputs:
  cli-version:
    description: Exact Doomer CLI release tag to install.
    required: false
    default: 2026.9.20-beta.5
  path:
    description: Path to the adversary project, relative to the workspace.
    required: false
    default: .
  builder:
    description: Package builder to use (local or docker).
    required: false
    default: local
  install-dependencies:
    description: Install locked project dependencies before local packaging (true or false). Disable when dependencies are preinstalled or builder is docker.
    required: false
    default: "true"
  name:
    description: Optional local artifact name override passed to doomer pack.
    required: false
  remote-reference:
    description: Optional fully qualified destination. When omitted, the authenticated Doomer namespace is used.
    required: false
  repository-name:
    description: Optional nested repository path within registry-namespace. The packaged version is used as its tag. library/* is reserved for admin promotion. Cannot be combined with remote-reference.
    required: false
  push-latest:
    description: Also push the packaged artifact with the latest tag (true or false).
    required: false
    default: "false"
  api-url:
    description: Doomer API URL.
    required: false
    default: https://doomer.ai/api
  profile:
    description: CLI credential profile. Defaults to push-action for OIDC, token, and OAuth; existing mode uses the CLI default when omitted.
    required: false
  auth-mode:
    description: Authentication mode (auto, oidc, token, oauth, or existing). Auto uses token when supplied and otherwise requests OIDC.
    required: false
    default: auto
  token:
    description: Service account token used by token authentication. For v1 compatibility, supplying it without auth-mode selects token auth.
    required: false
  client-name:
    description: Name shown while approving the OAuth device login.
    required: false
    default: Doomer push action
  registry-host:
    description: Optional OCI registry host override.
    required: false
  registry-namespace:
    description: Optional default OCI namespace override.
    required: false

outputs:
  reference:
    description: Canonical remote reference pushed to the registry.
    value: ${{ steps.push.outputs.reference }}
  digest:
    description: Pushed OCI image manifest digest.
    value: ${{ steps.push.outputs.digest }}
  manifest-digest:
    description: Pushed adversary manifest referrer digest.
    value: ${{ steps.push.outputs.manifest-digest }}
  local-reference:
    description: Local canonical reference produced by packaging.
    value: ${{ steps.package.outputs.local-reference }}
  latest-reference:
    description: Pushed latest reference when push-latest is enabled.
    value: ${{ steps.push.outputs.latest-reference }}
  namespace-signature-digest:
    description: Platform-issued namespace signature referrer digest for an Doomer private registry publish; empty for external or public repositories.
    value: ${{ steps.push.outputs.namespace-signature-digest }}
  namespace-trust-digest:
    description: Platform-endorsed namespace trust referrer digest for an Doomer private registry publish; empty for external or public repositories.
    value: ${{ steps.push.outputs.namespace-trust-digest }}

runs:
  using: composite
  steps:
    - name: Install Doomer CLI
      shell: bash
      env:
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"

    - name: Validate and package
      id: package
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BUILDER: ${{ inputs.builder }}
        INPUT_INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
        INPUT_NAME: ${{ inputs.name }}
      run: bash "$GITHUB_ACTION_PATH/scripts/package.sh"

    - name: Authenticate and push
      id: push
      shell: bash
      env:
        INPUT_LOCAL_REFERENCE: ${{ steps.package.outputs.local-reference }}
        INPUT_REMOTE_REFERENCE: ${{ inputs.remote-reference }}
        INPUT_REPOSITORY_NAME: ${{ inputs.repository-name }}
        INPUT_PUSH_LATEST: ${{ inputs.push-latest }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_AUTH_MODE: ${{ inputs.auth-mode }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_CLIENT_NAME: ${{ inputs.client-name }}
        INPUT_REGISTRY_HOST: ${{ inputs.registry-host }}
        INPUT_REGISTRY_NAMESPACE: ${{ inputs.registry-namespace }}
      run: bash "$GITHUB_ACTION_PATH/scripts/push.sh"

branding:
  icon: upload-cloud
  color: purple
