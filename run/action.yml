name: Run Doomer
description: Install the Doomer CLI and automatically select or explicitly run adversaries against a local repository.

inputs:
  adversaries:
    description: Use auto to pull accessible adversaries and select those matching the change, or provide one or more references separated by whitespace or newlines.
    required: false
    default: auto
  cli-version:
    description: Exact Doomer CLI release tag to install.
    required: false
    default: 2026.9.19.2
  path:
    description: Path to the source directory to review, relative to the workspace.
    required: false
    default: .
  data-dir:
    description: Absolute directory for cached adversary artifacts. Defaults to RUNNER_TEMP/adversary-data. Credentials are stored separately.
    required: false
  base:
    description: Git base ref for change detection (defaults to the detected default branch when head is set).
    required: false
  head:
    description: Git head ref for change detection (defaults to HEAD when base is set).
    required: false
  all-files:
    description: Scan the entire target instead of the inferred pull-request or branch diff (true or false).
    required: false
    default: "false"
  github-review:
    description: Post findings as a GitHub pull-request review (auto, true, or false). Auto enables reviews for pull_request events.
    required: false
    default: auto
  github-submit:
    description: Submit the GitHub review as an informational comment instead of leaving it pending (true or false).
    required: false
    default: "true"
  include-summary:
    description: Include the aggregate assessment and opinion in the GitHub review body (true or false). Inline and body-only findings are still posted when false.
    required: false
    default: "true"
  resolve-addressed-comments:
    description: Resolve prior Adversary review threads when a successful rerun no longer reports their findings (true or false).
    required: false
    default: "true"
  comment-tone:
    description: PR comment voice for supported CLI versions (direct, neutral, or coaching). Empty uses the CLI default.
    required: false
  comment-conciseness:
    description: PR comment length for supported CLI versions (terse, standard, or explanatory). Empty uses the CLI default.
    required: false
  github-token:
    description: GitHub token used to post the pull-request review. Defaults to github.token.
    required: false
  builder:
    description: Build mechanism for local adversaries (local or docker).
    required: false
    default: local
  build:
    description: Build a local adversary before running (true or false). May update dist.
    required: false
    default: "false"
  force:
    description: Run even when triggers.files_changed does not match (true or false).
    required: false
    default: "false"
  format:
    description: Output format (text or json).
    required: false
    default: text
  keep-temp:
    description: Do not delete the temporary run directory (true or false).
    required: false
    default: "false"
  no-network:
    description: Require network access to be disabled for the adversary child (true or false).
    required: false
    default: "false"
  verbose:
    description: Print detailed execution diagnostics (true or false).
    required: false
    default: "false"
  include-suppressed:
    description: Request suppressed review findings when supported (true or false).
    required: false
    default: "false"
  shell:
    description: UNSAFE. Launch an unrestricted host shell in the adversary working directory (true or false).
    required: false
    default: "false"
  allow-unsafe-host-execution:
    description: Explicitly allow unrestricted HostExecutor use for an unknown publisher (true or false).
    required: false
    default: "false"
  timeout-minutes:
    description: Maximum wall-clock minutes for the entire review command, including pulls, indexing, and all adversaries. Must be positive; fractional minutes are allowed.
    required: false
    default: "10"
  timeout:
    description: Maximum individual adversary execution time as a Go duration (for example 10m). Empty or 0 disables the deadline.
    required: false
  build-timeout:
    description: Maximum explicit local build time as a Go duration (for example 10m).
    required: false
  model-provider:
    description: Model provider for model-backed adversaries (openai, cloudflare, anthropic, fireworks, or camel). Overrides ADVERSARY_MODEL_PROVIDER. Required unless exactly one supported provider key is present.
    required: false
  model:
    description: Provider model identifier for model-backed adversaries. Overrides ADVERSARY_MODEL. A model is required because CI rejects partial, non-model reviews.
    required: false
  model-api-key:
    description: Required provider API key for model-backed adversaries. Mapped to the selected provider's credential environment variable. Prefer a Depot CI or GitHub Actions secret.
    required: false
  openai-base-url:
    description: Optional OpenAI-compatible base URL override (ADVERSARY_OPENAI_BASE_URL).
    required: false
  cloudflare-account-id:
    description: Cloudflare account ID used by the AI Gateway REST API (CLOUDFLARE_ACCOUNT_ID).
    required: false
  cloudflare-gateway-id:
    description: Optional Cloudflare AI Gateway ID (ADVERSARY_CLOUDFLARE_GATEWAY_ID).
    required: false
  cloudflare-base-url:
    description: Optional Cloudflare AI REST API base URL override (ADVERSARY_CLOUDFLARE_BASE_URL).
    required: false
  anthropic-base-url:
    description: Optional Anthropic-compatible base URL override (ADVERSARY_ANTHROPIC_BASE_URL).
    required: false
  fireworks-base-url:
    description: Optional Fireworks-compatible base URL override (ADVERSARY_FIREWORKS_BASE_URL).
    required: false
  camel-base-url:
    description: Optional Camel-compatible base URL override (ADVERSARY_CAMEL_BASE_URL).
    required: false
  fail-on-findings:
    description: Fail the step when the review reports findings (true or false). Defaults to false so findings are review feedback rather than infrastructure failures.
    required: false
    default: "false"
  api-url:
    description: Doomer API URL.
    required: false
    default: https://doomer.ai/api
  profile:
    description: CLI credential profile for auth-mode existing (and as a prefix for ephemeral OIDC/token/OAuth profiles). Owned authentication modes always use a unique action-owned profile that is removed after the step; existing/none never log out.
    required: false
  auth-mode:
    description: Authentication mode (none, oidc, token, oauth, or existing). OIDC uses a short-lived GitHub Actions or Depot CI identity.
    required: false
    default: none
  token:
    description: Service account token used by token authentication. Pass a Depot CI or GitHub Actions secret. Prefer a pull-scoped token, not a push credential.
    required: false
  client-name:
    description: Name shown while approving the OAuth device login.
    required: false
    default: Doomer run action
  registry-host:
    description: Optional OCI registry host override.
    required: false
  registry-namespace:
    description: Optional default OCI namespace for service-account login and pulls.
    required: false

outputs:
  exit-code:
    description: Exit code from doomer run (0 success, 1 findings, 2 usage, 3 execution failure, 4 network/auth), or 124 when timeout-minutes expires.
    value: ${{ steps.run.outputs.exit-code }}
  findings-count:
    description: Number of findings when format is json; empty for text output.
    value: ${{ steps.run.outputs.findings-count }}
  result-file:
    description: Path to captured stdout when format is json; empty for text output.
    value: ${{ steps.run.outputs.result-file }}
  outcome:
    description: success, findings, or failure.
    value: ${{ steps.run.outputs.outcome }}

runs:
  using: composite
  steps:
    - name: Install Doomer CLI
      shell: bash
      env:
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        # Authenticate the release lookup/download to avoid unauthenticated
        # api.github.com 403 rate-limiting on hosted runners.
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"

    - name: Authenticate and run
      id: run
      shell: bash
      env:
        INPUT_ADVERSARIES: ${{ inputs.adversaries }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_DATA_DIR: ${{ inputs.data-dir }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_ALL_FILES: ${{ inputs.all-files }}
        INPUT_GITHUB_REVIEW: ${{ inputs.github-review }}
        INPUT_GITHUB_SUBMIT: ${{ inputs.github-submit }}
        INPUT_INCLUDE_SUMMARY: ${{ inputs.include-summary }}
        INPUT_RESOLVE_ADDRESSED_COMMENTS: ${{ inputs.resolve-addressed-comments }}
        INPUT_COMMENT_TONE: ${{ inputs.comment-tone }}
        INPUT_COMMENT_CONCISENESS: ${{ inputs.comment-conciseness }}
        INPUT_BUILDER: ${{ inputs.builder }}
        INPUT_BUILD: ${{ inputs.build }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_KEEP_TEMP: ${{ inputs.keep-temp }}
        INPUT_NO_NETWORK: ${{ inputs.no-network }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_INCLUDE_SUPPRESSED: ${{ inputs.include-suppressed }}
        INPUT_SHELL: ${{ inputs.shell }}
        INPUT_ALLOW_UNSAFE_HOST_EXECUTION: ${{ inputs.allow-unsafe-host-execution }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_BUILD_TIMEOUT: ${{ inputs.build-timeout }}
        INPUT_MODEL_PROVIDER: ${{ inputs.model-provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MODEL_API_KEY: ${{ inputs.model-api-key }}
        INPUT_OPENAI_BASE_URL: ${{ inputs.openai-base-url }}
        INPUT_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        INPUT_CLOUDFLARE_GATEWAY_ID: ${{ inputs.cloudflare-gateway-id }}
        INPUT_CLOUDFLARE_BASE_URL: ${{ inputs.cloudflare-base-url }}
        INPUT_ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        INPUT_FIREWORKS_BASE_URL: ${{ inputs.fireworks-base-url }}
        INPUT_CAMEL_BASE_URL: ${{ inputs.camel-base-url }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_AUTH_MODE: ${{ inputs.auth-mode }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_CLIENT_NAME: ${{ inputs.client-name }}
        INPUT_REGISTRY_HOST: ${{ inputs.registry-host }}
        INPUT_REGISTRY_NAMESPACE: ${{ inputs.registry-namespace }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run.sh"

branding:
  icon: search
  color: purple
