name: Release actions

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable action tag to release (vMAJOR.MINOR.PATCH).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-moving-major-tags
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Test release
        run: bash test/test.sh
      - name: Verify default CLI can be installed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="$(awk '/^  cli-version:/ { input = 1; next } input && /^    default:/ { print $2; exit }' run/action.yml)"
          test -n "$version"
          INPUT_CLI_VERSION="$version" bash run/scripts/install.sh

  publish:
    needs: test
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Update major tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/release.sh
